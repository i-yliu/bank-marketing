<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>银行电话营销认购分析</title>
<meta name="description" content="零基础互动学习：用 41,188 条真实银行电话营销数据，一步步完成定期存款认购影响因素分析。">
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f1f0ec; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --neutral:#c9c8c1;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c8:#e34948;
  --accent:#2a78d6; --accent-ink:#1c5cab; --wash:rgba(42,120,214,.09);
  --good:#006300; --good-wash:rgba(12,163,12,.10); --bad:#d03b3b; --bad-wash:rgba(208,59,59,.09);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --neutral:#4a4a46;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c8:#e66767;
    --accent:#3987e5; --accent-ink:#86b6ef; --wash:rgba(57,135,229,.14);
    --good:#0ca30c; --good-wash:rgba(12,163,12,.14); --bad:#e66767; --bad-wash:rgba(230,103,103,.12);
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#242422; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --neutral:#4a4a46;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c8:#e66767;
  --accent:#3987e5; --accent-ink:#86b6ef; --wash:rgba(57,135,229,.14);
  --good:#0ca30c; --good-wash:rgba(12,163,12,.14); --bad:#e66767; --bad-wash:rgba(230,103,103,.12);
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:16px/1.75 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;}
a{color:var(--accent-ink)}
button{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.side{width:268px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--border);background:var(--surface);padding:22px 14px 28px}
.brand{font-weight:700;font-size:15px;line-height:1.4;padding:0 10px 14px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:12px;margin-top:2px}
.prog{margin:0 10px 14px}
.prog-bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog-bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.prog-txt{font-size:12px;color:var(--muted);margin-top:4px}
.toc{list-style:none;margin:0;padding:0}
.toc>li>a{display:flex;gap:8px;align-items:baseline;padding:7px 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-size:14px;line-height:1.45}
.toc>li>a:hover{background:var(--surface-2)}
.toc>li.on>a{background:var(--wash);color:var(--ink);font-weight:600}
.toc .n{flex:none;width:22px;color:var(--muted);font-size:13px}
.toc .ck{margin-left:auto;color:var(--good);font-size:12px}
.toc ul{list-style:none;margin:2px 0 6px 30px;padding:0;border-left:1px solid var(--border)}
.toc ul a{display:block;padding:3px 10px;font-size:13px;color:var(--muted);text-decoration:none}
.toc ul a:hover{color:var(--ink)}
/* ---------- main ---------- */
main{flex:1;min-width:0}
.topbar{display:none}
article{max-width:800px;margin:0 auto;padding:36px 28px 20px}
.pager{max-width:800px;margin:0 auto;padding:10px 28px 60px;display:flex;gap:12px;justify-content:space-between}
.pager a{flex:1;display:block;padding:14px 16px;border:1px solid var(--border);border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface)}
.pager a:hover{border-color:var(--accent)}
.pager a small{display:block;color:var(--muted);font-size:12px}
.pager a.next{text-align:right}
.pager span{flex:1}
@media (max-width:900px){
  .side{position:fixed;z-index:30;left:0;top:0;transform:translateX(-100%);transition:transform .25s;box-shadow:0 0 40px rgba(0,0,0,.2)}
  .side.open{transform:none}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
  .scrim.open{display:block}
  .topbar{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .topbar button{border:1px solid var(--border);background:var(--surface-2);border-radius:8px;padding:4px 10px;font-size:14px;cursor:pointer}
  .topbar .tt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .topbar .tp{font-size:12px;color:var(--muted)}
  article{padding:22px 16px 10px}
  .pager{padding:10px 16px 40px}
}
/* ---------- typography ---------- */
h1{font-size:30px;line-height:1.3;margin:6px 0 14px;letter-spacing:.01em}
h2{font-size:22px;line-height:1.4;margin:44px 0 12px;padding-top:6px}
h3{font-size:18px;line-height:1.5;margin:30px 0 8px}
h4{font-size:16px;margin:20px 0 6px}
p{margin:10px 0}
.eyebrow{font-size:13px;color:var(--accent-ink);font-weight:600;letter-spacing:.04em}
.lead{font-size:17px;color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:14px}
.chap-h{border-bottom:1px solid var(--border);padding-bottom:14px;margin-bottom:8px}
.chap-h .eyebrow{margin-bottom:2px}
.chap-h p{color:var(--ink-2);margin:4px 0 0}
b.hl{background:linear-gradient(transparent 60%,var(--wash) 60%);font-weight:600}
@media (max-width:600px){h1{font-size:25px}h2{font-size:20px}}
/* ---------- boxes ---------- */
.box{border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:16px 18px;margin:18px 0;box-shadow:var(--shadow)}
.box>.tag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.04em;padding:1px 8px;border-radius:999px;margin-bottom:6px}
.concept{border-left:4px solid var(--accent)}
.concept>.tag{background:var(--wash);color:var(--accent-ink)}
.analogy>.tag{background:var(--surface-2);color:var(--ink-2)}
.try{border-left:4px solid var(--c3)}
.try>.tag{background:rgba(27,175,122,.12);color:var(--ink)}
.ours{background:var(--surface-2);border-style:dashed;box-shadow:none}
.ours>.tag{background:var(--surface);color:var(--ink-2);border:1px solid var(--border)}
.warn{border-left:4px solid var(--c2)}
.warn>.tag{background:rgba(235,104,52,.12);color:var(--ink)}
.box p:first-of-type{margin-top:2px}
.box p:last-child{margin-bottom:0}
details.code{margin:12px 0;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
details.code summary{cursor:pointer;padding:8px 14px;font-size:14px;color:var(--ink-2);list-style:none}
details.code summary::before{content:"▸ ";color:var(--muted)}
details.code[open] summary::before{content:"▾ "}
details.code pre{margin:0;padding:12px 14px;border-top:1px solid var(--border);overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink)}
pre .cm{color:var(--muted)}
details.adv{margin:16px 0;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:0 16px}
details.adv>summary{cursor:pointer;padding:12px 0;font-weight:600;font-size:15px}
details.adv[open]{padding-bottom:12px}
/* ---------- stat tiles ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}
.stat{border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:12px 14px}
.stat .lb{font-size:13px;color:var(--ink-2)}
.stat .v{font-size:26px;font-weight:650;line-height:1.3}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.hero-num{font-size:56px;font-weight:650;line-height:1.1}
/* ---------- controls ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;line-height:1.5}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 6px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px;font-size:15px;cursor:pointer;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--ink)}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:14px;cursor:pointer;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--surface)}
.field{margin:10px 0}
.field>label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=number]{font:inherit;width:110px;padding:5px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink)}
.slider-row{display:flex;align-items:center;gap:12px}
.slider-row input{flex:1}
.slider-row output{font-weight:650;min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
/* ---------- charts ---------- */
.chart{width:100%;margin:6px 0;touch-action:pan-y}
.chart svg{display:block;overflow:visible}
.chart-title{font-weight:600;font-size:15px;margin:14px 0 0}
.chart-sub{font-size:13px;color:var(--muted);margin:0 0 4px}
svg text{font-family:inherit}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .axis{stroke:var(--axis);stroke-width:1}
svg .tick{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
svg .lab{fill:var(--ink-2);font-size:13px}
svg .val{fill:var(--ink);font-size:12px;font-variant-numeric:tabular-nums}
svg .ref{stroke:var(--ink-2);stroke-width:1.25}
svg .ref-soft{stroke:var(--axis);stroke-width:1.5}
svg .ref-lab{fill:var(--ink-2);font-size:11px}
svg .axis-lab{fill:var(--muted);font-size:12px}
svg .row-bg{fill:transparent}
svg .row.hov .row-bg{fill:var(--surface-2)}
svg .xy-hit{fill:transparent;cursor:crosshair}
svg .cross-line{stroke:var(--ink-2);stroke-width:1}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;color:var(--ink-2);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px}
.legend i.ln{height:3px;width:16px;border-radius:2px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:10px;padding:8px 11px;font-size:13px;line-height:1.55;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:260px;display:none}
.tip b{font-weight:650}
.tip .tl{color:var(--muted);font-size:12px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 9px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{font-weight:600;color:var(--ink-2);font-size:13px;background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:var(--wash)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;margin:12px 0;background:var(--surface)}
.tbl-wrap table th:first-child,.tbl-wrap table td:first-child{position:sticky;left:0;background:inherit}
.tbl-wrap td.lbl{background:var(--surface)}
.col-y{background:var(--wash)!important}
.sample th{cursor:pointer}
.sample th small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.sample th.sel,.sample td.sel{outline:2px solid var(--accent);outline-offset:-2px}
/* ---------- dots ---------- */
.dots{display:grid;grid-template-columns:repeat(20,1fr);gap:4px;max-width:440px;margin:12px 0}
.dots i{aspect-ratio:1;border-radius:50%;background:var(--neutral);transition:background .25s,transform .25s}
.dots i.yes{background:var(--c1)}
.dots i.pop{transform:scale(1.25)}
.dots.d10{grid-template-columns:repeat(10,1fr);max-width:300px}
.key-row{display:flex;gap:16px;font-size:13px;color:var(--ink-2);flex-wrap:wrap}
.key-row span{display:inline-flex;align-items:center;gap:6px}
.key-row i{width:10px;height:10px;border-radius:50%;display:inline-block}
/* ---------- quiz ---------- */
.quiz{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:16px 18px;margin:20px 0}
.quiz .qh{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
.quiz .q{font-weight:600;margin:4px 0 10px}
.quiz .opt{display:block;width:100%;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:15px;line-height:1.5}
.quiz .opt:hover{border-color:var(--accent)}
.quiz .opt.right{border-color:var(--good);background:var(--good-wash)}
.quiz .opt.wrong{border-color:var(--bad);background:var(--bad-wash)}
.quiz .fb{display:none;margin-top:10px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.quiz.done .fb{display:block}
.fb .ok{color:var(--good);font-weight:650}
.fb .no{color:var(--bad);font-weight:650}
/* ---------- misc components ---------- */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin:14px 0}
.flow .st{flex:1 1 120px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:10px 12px;text-decoration:none;color:var(--ink);position:relative}
.flow a.st:hover{border-color:var(--accent)}
.flow .st b{display:block;font-size:12px;color:var(--muted);font-weight:500}
.flow .st span{font-weight:600;font-size:15px}
.flow .st em{display:block;font-style:normal;font-size:12px;color:var(--ink-2);margin-top:2px}
.pipe{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:12px 0}
.pipe .pb{border:1px solid var(--border);border-radius:10px;padding:8px 12px;background:var(--surface);font-size:14px;text-align:center}
.pipe .pb.dark{background:var(--ink);color:var(--surface)}
.pipe .ar{color:var(--muted)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.card{border:1px solid var(--border);border-radius:14px;background:var(--surface);padding:14px 16px}
.card h4{margin:0 0 4px;font-size:16px;display:flex;gap:8px;align-items:baseline}
.card h4 .i{color:var(--muted);font-weight:500;font-size:14px}
.card p{margin:4px 0;font-size:15px}
.card .ev{font-size:13px;color:var(--ink-2);border-top:1px solid var(--border);margin-top:8px;padding-top:6px}
@media (max-width:640px){.cards{grid-template-columns:1fr}}
.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:12px 0}
.fgroup{border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--surface)}
.fgroup h4{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.fgroup .chip{font-size:13px;padding:2px 10px}
.fgroup.post .chip{text-decoration:line-through;color:var(--muted)}
@media (max-width:640px){.fields{grid-template-columns:1fr}}
.fdetail{min-height:54px;font-size:15px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.onehot{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0}
.onehot div{border:1px solid var(--border);border-radius:8px;padding:4px 6px;text-align:center;font-size:12px;min-width:62px;background:var(--surface)}
.onehot div b{display:block;font-size:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.onehot div.on{border-color:var(--accent);background:var(--wash)}
.onehot div.on b{color:var(--accent-ink)}
.split{display:grid;grid-template-columns:4fr 1fr;gap:12px;margin:10px 0}
.split .part{border:1px solid var(--border);border-radius:12px;padding:10px;background:var(--surface)}
.split .part h5{margin:0 0 6px;font-size:13px;font-weight:600}
.split .dots{grid-template-columns:repeat(16,1fr);max-width:none;margin:4px 0}
.split .part.test .dots{grid-template-columns:repeat(4,1fr)}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;margin:12px 0;font-size:14px}
.cm .h{color:var(--muted);font-size:12px;text-align:center;align-self:end}
.cm .rh{color:var(--muted);font-size:12px;writing-mode:horizontal-tb;align-self:center;text-align:right;padding-right:4px}
.cm .c{border-radius:10px;padding:10px;text-align:center;border:1px solid var(--border)}
.cm .c b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.cm .c small{display:block;color:var(--ink-2);font-size:12px}
.cm .c.ok{background:var(--good-wash)}
.cm .c.err{background:var(--bad-wash)}
.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.mt div{border:1px solid var(--border);border-radius:10px;padding:8px 10px;background:var(--surface)}
.mt div span{font-size:12px;color:var(--ink-2);display:block}
.mt div b{font-size:20px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.mt{grid-template-columns:repeat(2,1fr)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:720px){.two{grid-template-columns:1fr}}
.tree-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:8px 0;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.tree-wrap svg{display:block}
.tnode rect{fill:var(--surface);stroke:var(--axis);stroke-width:1}
.tnode.on rect{stroke:var(--accent);stroke-width:2;fill:var(--wash)}
.tnode text{fill:var(--ink);font-size:12px}
.tnode text.s{fill:var(--ink-2);font-size:11px}
.tedge{stroke:var(--axis);stroke-width:1.5;fill:none}
.tedge.on{stroke:var(--accent);stroke-width:2.5}
.tel{fill:var(--muted);font-size:11px}
.walker{border:1px solid var(--border);border-radius:12px;padding:12px 14px;background:var(--surface-2);margin:10px 0}
.walker .path{font-size:13px;color:var(--ink-2)}
.walker .qq{font-weight:600;margin:6px 0}
.meter{height:10px;border-radius:5px;background:var(--surface-2);position:relative;margin:6px 0 2px;overflow:visible}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c1)}
.meter u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink-2)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin:10px 0}
.vs .p{border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;background:var(--surface)}
.vs .p b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.vs .p.win{border-color:var(--good);background:var(--good-wash)}
.heat{display:grid;gap:3px;font-size:12px;margin:10px 0}
.heat div{padding:6px 2px;text-align:center;border-radius:4px;font-variant-numeric:tabular-nums}
.heat .hd{color:var(--ink-2);background:none;text-align:right;padding-right:6px}
.heat .hc{color:var(--ink-2);background:none;font-size:11px;line-height:1.3}

  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t && t.getAttribute('data-tip')) { setHov(t); showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); }
  else if (!(e.target.closest && e.target.closest('.xy-hit'))) { if (tip.style.display==='block') hideTip(); }
});
document.addEventListener('pointerdown', function(e){
  var t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if (t && t.getAttribute('data-tip')) { setHov(t); showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); }
  else if (!(e.target.closest && e.target.closest('.xy-hit'))) hideTip();
});
window.addEventListener('scroll', function(){ if (tip.style.display==='block') hideTip(); }, {passive:true});

/* ================= chart registry ================= */
var REG = [];
function reg(el, draw){ el._draw = draw; REG.push(el); draw(); }
var rzT; window.addEventListener('resize', function(){ clearTimeout(rzT); rzT = setTimeout(function(){ REG = REG.filter(function(el){ return document.body.contains(el); }); REG.forEach(function(el){ el._draw(); }); }, 120); });

function ticks(a, b, n){
  n = n || 4; var span = b-a; if (span<=0) return [a];
  var s0 = span/n, mag = Math.pow(10, Math.floor(Math.log10(s0))), err = s0/mag;
  var step = (err>=7.5?10:err>=3.5?5:err>=1.5?2:1)*mag, out = [];
  for (var v = Math.ceil(a/step-1e-9)*step; v <= b+1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function niceMax(v){ if (v<=0) return 1; var t = ticks(0, v, 4), st = t.length>1 ? t[1]-t[0] : v; return Math.ceil(v/st-1e-9)*st; }
function hpath(x0, x1, y, h, r){
  r = r==null ? 4 : r; var w = x1-x0; if (Math.abs(w) < 0.5) return '';
  var rr = Math.min(r, Math.abs(w), h/2);
  if (w > 0) return 'M'+x0+','+y+'H'+(x1-rr)+'A'+rr+','+rr+' 0 0 1 '+x1+','+(y+rr)+'V'+(y+h-rr)+'A'+rr+','+rr+' 0 0 1 '+(x1-rr)+','+(y+h)+'H'+x0+'Z';
  return 'M'+x0+','+y+'H'+(x1+rr)+'A'+rr+','+rr+' 0 0 0 '+x1+','+(y+rr)+'V'+(y+h-rr)+'A'+rr+','+rr+' 0 0 0 '+(x1+rr)+','+(y+h)+'H'+x0+'Z';
}
function vpath(x, w, y0, y1, r){
  r = r==null ? 4 : r; var h = y0-y1; if (h < 0.5) return '';
  var rr = Math.min(r, h, w/2);
  return 'M'+x+','+y0+'V'+(y1+rr)+'A'+rr+','+rr+' 0 0 1 '+(x+rr)+','+y1+'H'+(x+w-rr)+'A'+rr+','+rr+' 0 0 1 '+(x+w)+','+(y1+rr)+'V'+y0+'Z';
}
function legend(items){
  return '<div class="legend">' + items.map(function(it){ return '<span><i class="'+(it.line?'ln':'')+'" style="background:'+it.color+'"></i>'+esc(it.name)+'</span>'; }).join('') + '</div>';
}

/* Horizontal bars (also dot mode / diverging mode) */
function hbar(el, getRows, o){
  o = o || {};
  reg(el, function(){
    var rows = typeof getRows === 'function' ? getRows() : getRows;
    var W = Math.max(280, el.clientWidth), fmt = o.fmt || function(v){ return pct(v); };
    var maxChars = Math.max.apply(null, rows.map(function(r){ return String(r.label).length; }));
    var labelW = o.diverging ? 0 : Math.min(Math.max(40, maxChars*13+4), W*0.4);
    var valW = o.valW || 52, rowH = o.rowH || 30, bh = Math.min(o.barH || 18, rowH-8);
    var topPad = (o.avg!=null || o.refLabel) ? 26 : 6, bot = 22;
    var H = topPad + rows.length*rowH + bot;
    var vals = rows.map(function(r){ return r.value; });
    var lo, hi;
    if (o.domain) { lo = o.domain[0]; hi = o.domain[1]; }
    else {
      hi = niceMax(Math.max.apply(null, vals.concat([o.avg||0, 0.0000001])));
      var mn = Math.min.apply(null, vals.concat([0]));
      lo = mn < 0 ? -niceMax(-mn) : 0;
      if (o.diverging) { var mm = Math.max(hi, -lo); hi = mm; lo = -mm; }
    }
    var x0 = o.diverging ? valW : labelW + 10, x1 = W - valW;
    var sx = function(v){ return x0 + (clamp(v,lo,hi)-lo)/(hi-lo)*(x1-x0); };
    var s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'条形图')+'">';
    ticks(lo, hi, W<460?3:5).forEach(function(t){
      var x = sx(t);
      s += '<line class="grid" x1="'+x+'" x2="'+x+'" y1="'+(topPad-4)+'" y2="'+(H-bot)+'"/>';
      s += '<text class="tick" x="'+x+'" y="'+(H-6)+'" text-anchor="middle">'+esc((o.tickFmt||fmt)(t))+'</text>';
    });
    var base = o.dot ? (o.ref!=null ? o.ref : lo) : 0;
    rows.forEach(function(r, i){
      var y = topPad + i*rowH, cy = y + rowH/2, by = cy - bh/2;
      var col = r.color || o.color || 'var(--c1)', op = r.faint ? 0.38 : 1;
      s += '<g class="row" data-tip="'+esc(r.tip||'')+'"><rect class="row-bg" x="0" y="'+y+'" width="'+W+'" height="'+rowH+'" rx="6"/>';
      if (o.diverging) {
        var neg = r.value < 0;
        s += '<text class="lab" x="'+(neg? sx(0)+8 : sx(0)-8)+'" y="'+cy+'" text-anchor="'+(neg?'start':'end')+'" dominant-baseline="central">'+esc(r.label)+'</text>';
        s += '<path d="'+hpath(sx(0), sx(r.value), by, bh)+'" style="fill:'+col+';opacity:'+op+'"/>';
        s += '<text class="val" x="'+(neg? sx(r.value)-5 : sx(r.value)+5)+'" y="'+cy+'" text-anchor="'+(neg?'end':'start')+'" dominant-baseline="central">'+esc(r.valLabel!=null?r.valLabel:fmt(r.value))+'</text>';
      } else {
        s += '<text class="lab" x="'+labelW+'" y="'+cy+'" text-anchor="end" dominant-baseline="central">'+esc(r.label)+'</text>';
        if (o.dot) {
          s += '<line x1="'+sx(base)+'" x2="'+sx(r.value)+'" y1="'+cy+'" y2="'+cy+'" style="stroke:'+col+';stroke-width:2;opacity:.5"/>';
          s += '<circle cx="'+sx(r.value)+'" cy="'+cy+'" r="6" style="fill:'+col+';stroke:var(--surface);stroke-width:2"/>';
          s += '<text class="val" x="'+(sx(r.value)+(r.value>=base?11:-11))+'" y="'+cy+'" text-anchor="'+(r.value>=base?'start':'end')+'" dominant-baseline="central">'+esc(r.valLabel!=null?r.valLabel:fmt(r.value))+'</text>';
        } else {
          s += '<path d="'+hpath(sx(0), sx(r.value), by, bh)+'" style="fill:'+col+';opacity:'+op+'"/>';
          var vx = r.value >= 0 ? sx(r.value)+6 : sx(0)+6;
          s += '<text class="val" x="'+vx+'" y="'+cy+'" dominant-baseline="central">'+esc(r.valLabel!=null?r.valLabel:fmt(r.value))+'</text>';
        }
      }
      s += '</g>';
    });
    if (!o.dot) s += '<line class="axis" x1="'+sx(0)+'" x2="'+sx(0)+'" y1="'+(topPad-4)+'" y2="'+(H-bot)+'"/>';
    var refV = o.avg!=null ? o.avg : (o.dot && o.ref!=null ? o.ref : null);
    if (refV!=null) {
      var rx = sx(refV), anc = rx > W-70 ? 'end' : (rx < x0+40 ? 'start' : 'middle');
      s += '<line class="ref" x1="'+rx+'" x2="'+rx+'" y1="'+(topPad-8)+'" y2="'+(H-bot)+'"/>';
      s += '<text class="ref-lab" x="'+rx+'" y="'+(topPad-12)+'" text-anchor="'+anc+'">'+esc(o.avgLabel || o.refLabel || ('整体平均 '+fmt(refV)))+'</text>';
    }
    el.innerHTML = s + '</svg>';
  });
}

/* XY line chart */
function xy(el, getO){
  reg(el, function(){
    var o = typeof getO === 'function' ? getO() : getO;
    var W = Math.max(280, el.clientWidth), H = o.height || 250;
    var m = {l: o.ml!=null?o.ml:46, r: o.mr!=null?o.mr:18, t: o.yLabel ? 28 : 14, b: o.xLabel ? 44 : 28};
    var xa=o.x[0], xb=o.x[1], ya=o.y[0], yb=o.y[1];
    var pw = W-m.l-m.r, ph = H-m.t-m.b;
    var sx = function(v){ return m.l + (v-xa)/(xb-xa)*pw; };
    var sy = function(v){ return m.t + ph - (v-ya)/(yb-ya)*ph; };
    var xf = o.xFmt || function(v){ return v; }, yf = o.yFmt || function(v){ return v; };
    var s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'折线图')+'">';
    (o.yTicks || ticks(ya, yb, 4)).forEach(function(t){
      s += '<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(t)+'" y2="'+sy(t)+'"/>';
      s += '<text class="tick" x="'+(m.l-6)+'" y="'+sy(t)+'" text-anchor="end" dominant-baseline="central">'+esc(yf(t))+'</text>';
    });
    (o.xTicks || ticks(xa, xb, W<460?4:6)).forEach(function(t){
      s += '<text class="tick" x="'+sx(t)+'" y="'+(m.t+ph+16)+'" text-anchor="middle">'+esc(xf(t))+'</text>';
    });
    s += '<line class="axis" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(ya)+'" y2="'+sy(ya)+'"/>';
    if (o.xLabel) s += '<text class="axis-lab" x="'+(m.l+pw/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(o.xLabel)+'</text>';
    if (o.yLabel) s += '<text class="axis-lab" x="'+(m.l-6)+'" y="'+(m.t-14)+'" text-anchor="start">'+esc(o.yLabel)+'</text>';
    (o.refs || []).forEach(function(r){
      if (r.diag) s += '<line class="ref-soft" x1="'+sx(xa)+'" y1="'+sy(ya)+'" x2="'+sx(xb)+'" y2="'+sy(yb)+'"/>';
      if (r.x!=null) { s += '<line class="ref" x1="'+sx(r.x)+'" x2="'+sx(r.x)+'" y1="'+m.t+'" y2="'+sy(ya)+'"/>'; if (r.label) s += '<text class="ref-lab" x="'+(sx(r.x)+(r.anchor==='end'?-5:5))+'" y="'+(m.t+10)+'" text-anchor="'+(r.anchor||'start')+'">'+esc(r.label)+'</text>'; }
      if (r.y!=null) { s += '<line class="ref" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(r.y)+'" y2="'+sy(r.y)+'"/>'; if (r.label) s += '<text class="ref-lab" x="'+(r.anchor==='start' ? m.l+4 : W-m.r)+'" y="'+(sy(r.y)-5)+'" text-anchor="'+(r.anchor==='start'?'start':'end')+'">'+esc(r.label)+'</text>'; }
    });
    (o.series || []).forEach(function(se){
      var d = se.pts.map(function(p, i){ return (i?'L':'M') + sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1); }).join('');
      if (se.area) s += '<path d="'+d+'L'+sx(se.pts[se.pts.length-1][0])+','+sy(ya)+'L'+sx(se.pts[0][0])+','+sy(ya)+'Z" style="fill:'+se.color+';opacity:.1"/>';
      s += '<path d="'+d+'" style="fill:none;stroke:'+se.color+';stroke-width:'+(se.width||2)+';stroke-linejoin:round;stroke-linecap:round;opacity:'+(se.opacity||1)+'"/>';
      if (se.dots) se.pts.forEach(function(p){ s += '<circle cx="'+sx(p[0])+'" cy="'+sy(p[1])+'" r="4" style="fill:'+se.color+';stroke:var(--surface);stroke-width:2"/>'; });
      if (se.endLabel) { var lp = se.pts[se.pts.length-1]; s += '<text class="val" x="'+(sx(lp[0])-4)+'" y="'+(sy(lp[1])-9)+'" text-anchor="end">'+esc(se.endLabel)+'</text>'; }
    });
    (o.points || []).forEach(function(p){
      s += '<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="'+(p.r||5)+'" style="fill:'+p.color+';stroke:var(--surface);stroke-width:2;opacity:'+(p.opacity||1)+'"'+(p.tip?' data-tip="'+esc(p.tip)+'"':'')+'/>';
    });
    (o.markers || []).forEach(function(p){
      s += '<circle cx="'+sx(p.x)+'" cy="'+sy(p.y)+'" r="7" style="fill:'+p.color+';stroke:var(--surface);stroke-width:2.5"/>';
      if (p.label) { var right = sx(p.x) < W-140; s += '<text class="val" style="font-weight:600" x="'+(sx(p.x)+(right?12:-12))+'" y="'+(sy(p.y)+(p.dy||-10))+'" text-anchor="'+(right?'start':'end')+'">'+esc(p.label)+'</text>'; }
    });
    if (o.hover) s += '<rect class="xy-hit" x="'+m.l+'" y="'+m.t+'" width="'+pw+'" height="'+ph+'"/>';
    s += '<g class="cross" pointer-events="none"></g></svg>';
    var leg = (o.legend && o.legend.length) ? legend(o.legend) : '';
    el.innerHTML = leg + s;
    if (o.hover) {
      var svg = el.querySelector('svg'), hit = svg.querySelector('.xy-hit'), cross = svg.querySelector('.cross');
      var move = function(e){
        var rc = svg.getBoundingClientRect(), xv = xa + (e.clientX - rc.left - m.l)/pw*(xb-xa);
        var res = o.hover(clamp(xv, xa, xb)); if (!res) return;
        var g = '<line class="cross-line" x1="'+sx(res.x)+'" x2="'+sx(res.x)+'" y1="'+m.t+'" y2="'+sy(ya)+'"/>';
        (res.pts||[]).forEach(function(p){ g += '<circle cx="'+sx(p.x!=null?p.x:res.x)+'" cy="'+sy(p.y)+'" r="5" style="fill:'+p.color+';stroke:var(--surface);stroke-width:2"/>'; });
        cross.innerHTML = g; showTip(res.html, e.clientX, e.clientY);
      };
      hit.addEventListener('pointermove', move);
      hit.addEventListener('pointerdown', move);
      hit.addEventListener('pointerleave', function(){ cross.innerHTML=''; tip.style.display='none'; });
    }
  });
}

/* Vertical columns (histograms) */
function vbars(el, getO){
  reg(el, function(){
    var o = typeof getO === 'function' ? getO() : getO;
    var W = Math.max(280, el.clientWidth), H = o.height || 150;
    var m = {l: 40, r: 12, t: o.title ? 22 : (o.refLabel ? 22 : 10), b: o.xLabel ? 40 : 24};
    var pw = W-m.l-m.r, ph = H-m.t-m.b, xa = o.x[0], xb = o.x[1];
    var ymax = o.yMax || niceMax(Math.max.apply(null, o.bins.map(function(b){ return b.v; })));
    var sx = function(v){ return m.l + (v-xa)/(xb-xa)*pw; }, sy = function(v){ return m.t + ph - v/ymax*ph; };
    var s = '<svg width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'柱状图')+'">';
    if (o.title) s += '<text class="lab" style="font-weight:600" x="'+m.l+'" y="13">'+esc(o.title)+'</text>';
    ticks(0, ymax, 3).forEach(function(t){
      s += '<line class="grid" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(t)+'" y2="'+sy(t)+'"/>';
      s += '<text class="tick" x="'+(m.l-6)+'" y="'+sy(t)+'" text-anchor="end" dominant-baseline="central">'+esc(o.yFmt? o.yFmt(t) : num(t))+'</text>';
    });
    o.bins.forEach(function(b){
      var x = sx(b.x0)+1, w = Math.max(1, sx(b.x1)-sx(b.x0)-2);
      s += '<g class="row" data-tip="'+esc(b.tip||'')+'"><rect class="row-bg" x="'+(x-1)+'" y="'+m.t+'" width="'+(w+2)+'" height="'+ph+'"/>';
      s += '<path d="'+vpath(x, w, sy(0), sy(b.v), 3)+'" style="fill:'+(b.color||'var(--c1)')+'"/></g>';
    });
    s += '<line class="axis" x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+sy(0)+'" y2="'+sy(0)+'"/>';
    (o.xTicks || ticks(xa, xb, 5)).forEach(function(t){ s += '<text class="tick" x="'+sx(t)+'" y="'+(m.t+ph+15)+'" text-anchor="middle">'+esc(o.xFmt? o.xFmt(t): t)+'</text>'; });
    if (o.xLabel) s += '<text class="axis-lab" x="'+(m.l+pw/2)+'" y="'+(H-4)+'" text-anchor="middle">'+esc(o.xLabel)+'</text>';
    if (o.refX!=null) { var rx = sx(o.refX); s += '<line class="ref" x1="'+rx+'" x2="'+rx+'" y1="'+(m.t-2)+'" y2="'+sy(0)+'"/>'; if (o.refLabel) s += '<text class="ref-lab" x="'+(rx + (rx>W-120?-5:5))+'" y="'+(o.title ? m.t+8 : m.t-8)+'" text-anchor="'+(rx>W-120?'end':'start')+'">'+esc(o.refLabel)+'</text>'; }
    el.innerHTML = s + '</svg>';
  });
}

/* ================= content helpers ================= */
var GLOSS = {
  '样本':'数据表中的一行。在本项目里，一个样本就是“银行联系了一位客户”这一条记录。',
  '特征':'描述样本的一列信息，比如年龄、职业、联系方式。模型根据特征来做判断，也叫“自变量”“字段”。',
  '标签':'我们想预测的结果那一列。本项目的标签是 y：客户最后有没有认购定期存款。',
  '转化率':'成功的人数 ÷ 被联系的总人数。这里指认购人数 ÷ 联系人数。',
  '类别不平衡':'两类结果的人数差距很大。本项目里认购的只有 11.3%，不认购的占 88.7%。',
  '数据泄漏':'模型在训练时“偷看”到了在真实预测时根本拿不到的信息，导致成绩虚高、实际没法用。',
  '事后字段':'事情发生之后才能知道的信息，比如“通话时长”——电话打完才知道。用它来预测“要不要打这个电话”是作弊。',
  '独热编码':'One-hot 编码：把“职业=学生”这种文字类别，变成一排 0/1 的开关，只有对应的那一格是 1。',
  '训练集':'给模型“学习”用的数据，就像课本和练习题。',
  '测试集':'模型学完之后才拿出来的“考试卷”，模型从没见过，用来检验真实水平。',
  '分层抽样':'拆分数据时，保证每一部分里“认购”和“不认购”的比例与整体一样。',
  '探索性数据分析':'EDA：建模前先用统计和图表“看看数据长什么样”，发现规律和问题。',
  '模型':'一套从数据里学出来的“打分规则”：输入客户的特征，输出这位客户认购的可能性。',
  '基线模型':'最简单、不动脑子的参照模型。新模型至少要比它好，才有意义。',
  '逻辑回归':'把各个特征乘以权重加起来，再用 S 形曲线压到 0~1 之间，得到概率。简单、好解释。',
  '决策树':'像“20 个问题”游戏，一层层地问是/否问题，把客户分到不同的小组。',
  '剪枝':'限制决策树长得太深、分得太细，防止它把训练数据“死记硬背”。',
  '过拟合':'模型在训练数据上表现极好，在新数据上却变差——学成了“死记硬背”，没学到真正的规律。',
  '随机森林':'训练几百棵各不相同的决策树，让它们一起投票（取平均），通常比单棵树更稳、更准。',
  '交叉验证':'把训练集分成 5 份，轮流用 4 份训练、1 份验证，取平均成绩，用来公平地挑选参数。',
  '阈值':'分数线。模型打分 ≥ 阈值，就判断为“会认购”（值得打电话）。',
  '混淆矩阵':'一张 2×2 的表，统计模型猜对、猜错的四种情况。',
  '准确率':'Accuracy：所有判断中猜对的比例。类别不平衡时会严重误导人。',
  '精确率':'Precision：模型说“会认购”的人里，真正认购的比例。衡量“打出去的电话有多少没白打”。',
  '召回率':'Recall：所有真正会认购的人里，被模型找出来的比例。衡量“有多少潜在客户没漏掉”。',
  'F1值':'精确率和召回率的调和平均，两者要兼顾时用它做综合评分。',
  'ROC曲线':'把阈值从高到低调一遍，画出“找到的认购者比例”与“误判的未认购者比例”的关系曲线。',
  'AUC':'ROC 曲线下的面积，0.5 等于瞎猜，1 是完美。也可以理解为：随机抽一个认购者和一个未认购者，模型给认购者打分更高的概率。',
  '置换重要性':'把某一列数据随机打乱，看模型成绩（AUC）掉多少。掉得越多，说明模型越依赖这个特征。',
  '部分依赖':'把所有客户的某个特征都改成同一个值，看模型平均打分怎么变。用来看一个因素的“影响方向”。',
  '多重共线性':'几个特征彼此高度相关、几乎在说同一件事。会让单个特征的重要性和系数变得不稳定。',
  '累积增益':'按模型打分从高到低打电话，打到前 X% 时，能找到全部认购者中的多少比例。',
  '提升度':'Lift：用模型挑出的名单转化率 ÷ 随机名单转化率。比如提升度 3 表示效率是随机拨打的 3 倍。',

function bindQuiz(root){

function shuffle(a, rnd){ rnd = rnd || Math.random; for (var i=a.length-1;i>0;i--){ var j=Math.floor(rnd()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

/* threshold metrics on the test set */
function confAt(t){
  var tp=0, fp=0, fn=0, tn=0;
  for (var i=0;i<NT;i++){ var pr = TS.p[i] >= t; if (TS.y[i]) { if (pr) tp++; else fn++; } else { if (pr) fp++; else tn++; } }
  var prec = tp+fp ? tp/(tp+fp) : 0, rec = tp/(tp+fn), f1 = prec+rec ? 2*prec*rec/(prec+rec) : 0;
  return {tp:tp, fp:fp, fn:fn, tn:tn, prec:prec, rec:rec, f1:f1, acc:(tp+tn)/NT, fpr: fp/(fp+tn)};
}
var BEST_F1_T = (function(){ var bt=0.5, bf=0; for (var t=0.05;t<=0.95;t+=0.01){ var c = confAt(t); if (c.f1>bf){ bf=c.f1; bt=+t.toFixed(2); } } return bt; })();
function interp(pts, x){ for (var i=1;i<pts.length;i++){ if (pts[i][0] >= x) { var a=pts[i-1], b=pts[i]; var f = b[0]===a[0] ? 1 : (x-a[0])/(b[0]-a[0]); return a[1] + f*(b[1]-a[1]); } } return pts[pts.length-1][1]; }

  return '<div class="chap-h"><div class="eyebrow">第二章</div><h1>数据与研究方法</h1><p>认识我们手里的数据，并把它整理成模型能用的样子。</p></div>'+

  concept('<p>数据集就像一张很大的 Excel 表：<br>· 每一<b>行</b>是一个 '+T('样本')+'：银行联系某位客户的一条记录；<br>· 每一<b>列</b>是一个字段：前 20 列是 '+T('特征')+'（描述信息），最后一列 y 是 '+T('标签')+'（结果）。</p>')+
  tryit('<p>下面是数据里真实的 8 行（已翻译成中文）。<b>点击任意列名</b>，看看这一列是什么意思。</p>'+
    '<div class="tbl-wrap"><table class="sample"><thead><tr>'+head+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
    '<div class="fdetail" id="colInfo">← 点击上面表格的列名，或下面的字段按钮</div>')+
  '<h3>21 个字段分成哪几类？</h3>'+
  '<p>按照报告大纲，我们把输入的特征分成<b>三大维度</b>：客户属性、营销触达、宏观经济。另外还有一个要剔除的“事后字段”，以及我们要预测的标签。</p>'+
  '<div class="fields">'+fg+'</div>'+
  '<h2 id="d2">2. 数据预处理</h2>'+
  '<p>原始数据不能直接丢给模型，需要先整理。我们做了四件事：</p>'+
  '<div class="flow">'+

  analogy('<p>想预测一场考试谁会及格，你拿“考试用了多长时间交卷”来预测。交卷越晚的人分数越高，看起来很准。可问题是：<b>考试开始前，你根本不知道谁会写多久</b>。</p>')+

  tryit('<p>切换下面的按钮，看看“保留”和“剔除”通话时长时，逻辑回归模型的成绩（'+T('AUC')+'，越接近 1 越好）：</p>'+

  ours('<p>剔除 <span class="kbd">duration</span>（通话时长）。原数据集的作者在说明文件里也明确建议：如果要建一个真实可用的预测模型，应当丢掉这个字段。</p>')+
  code('看看 Python 代码怎么写', '# 读取数据（文件用分号分隔）\ndf = pd.read_csv("bank-additional-full.csv", sep=";")\n# 把 yes/no 变成 1/0\ndf["y"] = (df["y"] == "yes").astype(int)\n# 用来预测的特征里不放 duration\nFEATURES = [c for c in df.columns if c not in ("duration", "y", "pdays")] + ["prev_contacted"]')+
  '<h3 id="d2b">② 处理特殊值：pdays = 999 是什么意思？</h3>'+
  '<p>“距上次联系天数”这一列里，有 <b>'+num(E.pdays_999)+'</b> 人（'+pct(E.pdays_999/E.n)+'）的数值是 999。这并不是真的隔了 999 天，而是数据记录者约定的<b>“以前从没联系过”</b>的代号。</p>'+
  '<p>如果直接当数字用，模型会以为“999 天”比“3 天”远得多，这种大小关系是假的。我们的做法是把它转换成一个新的 0/1 特征：</p>'+
  '<div class="pipe"><div class="pb">pdays = 999</div><span class="ar">→</span><div class="pb dark">以前是否被联系过 = 0</div></div>'+
  '<div class="pipe"><div class="pb">pdays = 3、6、12……</div><span class="ar">→</span><div class="pb dark">以前是否被联系过 = 1</div></div>'+
  warnb('<p><b>关于“未知”：</b>职业、教育、信用违约等列里有“unknown（未知）”。我们没有删掉这些行，而是把“未知”当成一个独立类别保留，因为“未知”本身可能带有信息。比如“信用违约 = 未知”的 '+num(R('default','未知').n)+' 人，认购率只有 '+pct(R('default','未知').rate)+'，明显低于“否”的 '+pct(R('default','否').rate)+'。</p>')+
  '<h3 id="d2c">③ 特征编码：把文字变成数字</h3>'+
  '<p>模型只认识数字，不认识“学生”“退休”这样的文字。最常用的方法叫 '+T('独热编码')+'（One-hot）：给每个类别准备一个“开关”，是这一类就打开（1），不是就关闭（0）。</p>'+
  tryit('<p>选一个职业，看看它被编码成了什么：</p><div class="chips" id="ohPick"></div><div class="onehot" id="ohOut"></div><p class="small" id="ohTxt"></p>')+
  concept('<p><b>为什么不直接编号 1、2、3……？</b> 如果“学生 = 9、退休 = 6”，模型会误以为学生“比退休大”，或者“退休 + 3 = 学生”——这些都毫无意义。独热编码让每个类别平等、互不干扰。</p>')+
  ours('<p>对 10 个文字类特征做独热编码，9 个数字类特征保留原值（逻辑回归额外做了标准化，让不同单位的数字可比）。<b>19 个原始特征 → '+D.split.n_features_encoded+' 列数字</b>。</p>')+
  code('看看 Python 代码怎么写', '# 文字类特征用独热编码；数字类特征直接用（逻辑回归再做标准化）\nprep = ColumnTransformer([\n    ("cat", OneHotEncoder(handle_unknown="ignore"), CAT_COLS),\n    ("num", StandardScaler(), NUM_COLS),\n])')+
  '<h3 id="d2d">④ 8:2 分层拆分：训练集和测试集</h3>'+
  analogy('<p>老师出期末考试题，不能直接用平时练习册上的原题，否则学生背答案也能考满分。同样，我们要把数据分成两份：<br>· <b>'+T('训练集')+'（80%）</b>：给模型学习用的“练习册”；<br>· <b>'+T('测试集')+'（20%）</b>：模型从没见过的“期末考卷”，用来检验真实水平。</p>')+
  '<p>那什么是“分层”？因为认购的人只占 11%，如果完全随机地分，测试集里认购的比例可能会偏高或偏低，考试就不公平了。'+T('分层抽样')+'保证两份数据里认购的比例都和整体一样。</p>'+
  tryit('<p>下面 100 个点代表 100 位客户，其中 11 位认购（蓝色）。比较“完全随机”和“分层”两种拆法，多点几次看看测试集里的认购比例。</p>'+
    '<div class="btns"><button class="btn" id="spR">完全随机拆分</button><button class="btn pri" id="spS">分层拆分</button></div>'+
    '<div class="split"><div class="part"><h5>训练集 80 人</h5><div id="spTr" class="dots"></div><div class="small" id="spTrT"></div></div><div class="part test"><h5>测试集 20 人</h5><div id="spTe" class="dots"></div><div class="small" id="spTeT"></div></div></div>'+
    '<div class="small" id="spLog"></div>')+

  code('看看 Python 代码怎么写', '# test_size=0.2 → 20% 做测试集；stratify=y → 按认购比例分层\nX_tr, X_te, y_tr, y_te = train_test_split(\n    X, y, test_size=0.2, stratify=y, random_state=42)')+
  quiz('d1','为什么要把“通话时长”剔除？',['它的数据有很多缺失','它和认购没有关系','打电话之前无法知道通话时长，用它预测属于“作弊”','它是文字，模型无法处理'],2,'通话时长和认购关系很强，但它是“事后字段”。保留它 AUC 会虚高到 '+f3(leak.with_duration_auc)+'，可在真实决策时根本拿不到这个信息。')+

mount: function(){
  var info = $('#colInfo');
  var showF = function(k){
    var f = FIELDS.filter(function(x){ return x[0]===k; })[0]; if (!f) return;
    info.innerHTML = '<b>'+f[2]+'</b> <span class="muted small">('+f[0]+' · '+f[1]+')</span><br>'+f[3];
    $$('.sample th, .sample td').forEach(function(c){ c.classList.toggle('sel', c.getAttribute('data-col')===k); });
  };
  $$('.sample th').forEach(function(th){ th.addEventListener('click', function(){ showF(th.getAttribute('data-col')); }); });
  $$('.fgroup .chip').forEach(function(b){ b.addEventListener('click', function(){ showF(b.getAttribute('data-f')); info.scrollIntoView({block:'nearest', behavior:'smooth'}); }); });
  hbar($('#durChart'), E.duration.map(function(r){ return {label:r.label, value:r.rate, tip:'<b>'+r.label+'</b><br>认购率 '+pct(r.rate)+'<br><span class="tl">'+num(r.n)+' 通电话</span>', color:'var(--muted)'}; }), {avg:E.rate, aria:'通话时长与认购率'});
  seg($('#leakSeg'), [{id:'keep',name:'保留通话时长（错误）'},{id:'drop',name:'剔除通话时长（正确）'}], 'keep', function(id){ leakDraw(id); });
  var leakDraw = function(id){
    var a = id==='keep' ? D.leak.with_duration_auc : D.leak.without_duration_auc;
    $('#leakOut').innerHTML = '<div class="slider-row"><div style="flex:1"><div class="meter"><i style="width:'+((a-0.5)/0.5*100)+'%;background:'+(id==='keep'?'var(--c2)':'var(--c1)')+'"></i></div><div class="small muted" style="display:flex;justify-content:space-between"><span>0.5 瞎猜</span><span>1.0 完美</span></div></div><div class="hero-num" style="font-size:34px">'+f3(a)+'</div></div>'+
      '<p class="small">'+(id==='keep' ? '成绩很高，但这是<b>虚高</b>：模型主要靠“通话时长”猜，真实使用时拿不到这个信息，模型就失灵了。' : '成绩降下来了，但这才是<b>真实可用</b>的水平：只用打电话之前就知道的信息。')+'</p>';
  };
  leakDraw('keep');
  // one-hot
  var jobs = dim('job').rows.map(function(r){ return r.label; });
  var ohDraw = function(j){
    $('#ohOut').innerHTML = jobs.map(function(x){ return '<div class="'+(x===j?'on':'')+'"><b>'+(x===j?1:0)+'</b>'+x+'</div>'; }).join('');
    $('#ohTxt').innerHTML = '“职业 = '+j+'” → 12 个格子里只有「'+j+'」是 1，其余都是 0。';
  };
  chips($('#ohPick'), jobs.map(function(x){ return {id:x, name:x}; }), '学生', ohDraw); ohDraw('学生');
  // split demo
  var people = []; for (var i=0;i<100;i++) people.push(i<11?1:0);
  var log = [];
  var spDraw = function(tr, te, kind){
    var dots = function(a){ return a.map(function(v){ return '<i class="'+(v?'yes':'')+'"></i>'; }).join(''); };
    var sTr = tr.slice().sort(function(a,b){return b-a;}), sTe = te.slice().sort(function(a,b){return b-a;});
    $('#spTr').innerHTML = dots(sTr); $('#spTe').innerHTML = dots(sTe);
    var kt = tr.reduce(function(a,b){return a+b;},0), ke = te.reduce(function(a,b){return a+b;},0);
    $('#spTrT').innerHTML = '认购 '+kt+' 人 = <b>'+pct(kt/80)+'</b>'; $('#spTeT').innerHTML = '认购 '+ke+' 人 = <b>'+pct(ke/20,0)+'</b>';
    log.unshift((kind==='s'?'分层':'随机')+'：测试集 '+pct(ke/20,0)); log = log.slice(0,8);
    $('#spLog').innerHTML = '最近几次测试集的认购比例：'+log.join(' · ')+'<br><span class="muted">整体是 11%。随机拆分时，测试集可能是 0%，也可能高达 25% 以上。</span>';
  };
  $('#spR').onclick = function(){ var a = shuffle(people.slice()); spDraw(a.slice(0,80), a.slice(80), 'r'); };
  $('#spS').onclick = function(){ var yes = shuffle(people.filter(function(v){return v;})), no = shuffle(people.filter(function(v){return !v;})); var te = yes.slice(0,2).concat(no.slice(0,18)), tr = yes.slice(2).concat(no.slice(18)); spDraw(tr, te, 's'); };
  $('#spS').onclick();
}});

  marital: function(){ return '单身（'+pct(R('marital','单身').rate)+'）略高于已婚（'+pct(R('marital','已婚').rate)+'），差别不大。“未知”只有 '+R('marital','未知').n+' 人，参考价值低。'; },
  education: function(){ return '大学学历（'+pct(R('education','大学').rate)+'）略高；初中最低（'+pct(R('education','初中(9年)').rate)+'）。“文盲”只有 '+R('education','文盲').n+' 人（浅色），样本太少，数字不可信。'; },
  'default': function(){ return '信用违约记录“未知”的客户认购率只有 '+pct(R('default','未知').rate)+'，明显低于“否”的 '+pct(R('default','否').rate)+'。“是”只有 3 人，没有统计意义。'; },
  housing: function(){ return '有没有房贷，认购率几乎一样（都在 11% 左右）——这个因素基本没有区分能力。'; },
  loan: function(){ return '有没有个人贷款，认购率也几乎一样。'; },
  poutcome: function(){ return '上次营销<b>成功</b>的客户，这次认购率高达 '+pct(R('poutcome','成功').rate)+'，约为平均水平的 '+(R('poutcome','成功').rate/E.rate).toFixed(1)+' 倍！老客户是“金矿”。'; },
  contact: function(){ return '手机联系 '+pct(R('contact','手机').rate)+'，座机只有 '+pct(R('contact','座机').rate)+'，相差约 '+(R('contact','手机').rate/R('contact','座机').rate).toFixed(1)+' 倍。'; },
  month: function(){ return '5 月电话打得最多（'+num(R('month','5月').n)+' 通），认购率却最低（'+pct(R('month','5月').rate)+'）；3、9、10、12 月认购率约 44%–51%，但电话量很少（浅色表示样本少于 1000）。'; },
  dow: function(){ return '周一到周五差别很小（10%–12%），星期几打电话不太重要。'; },
  campaign: function(){ return '<b>打得越多，越不买</b>：第 1 次就成交的占 '+pct(R('campaign','1次').rate)+'，同一活动打了 10 次以上的只有 '+pct(R('campaign','10次以上').rate)+'。反复打电话效果很差。'; },
  previous: function(){ return '以前联系过的客户更容易认购：以前 0 次 '+pct(R('previous','0次').rate)+'，2 次及以上高达 '+pct(R('previous','2次及以上').rate)+'。'; },
  euribor: function(){ var d=dim('euribor').rows; return '差距最大的一张图：利率 <1% 时认购率 '+pct(d[0].rate)+'，≥4.5% 时只有 '+pct(d[d.length-1].rate)+'，相差近 '+Math.round(d[0].rate/d[d.length-1].rate)+' 倍。'; },
  nr: function(){ return '就业人数越少（经济越差），认购率越高。就业人数 ≤5076 千人时，认购率普遍在 35%–57%。'; },
  evr: function(){ return '就业变动率为负（就业在萎缩）的时期，认购率明显更高；+1.1、+1.4（就业扩张）时只有 3%–5%。'; },
  conf: function(){ return '规律不是“越高越好”：信心指数在 -35~-30 之间时最高（'+pct(R('conf','-35~-30').rate)+'）。宏观指标之间互相纠缠，单看一个容易误读。'; }
};
page({id:'eda', num:'三', title:'探索性数据分析', subs:[['e1','1. 整体认购转化率'],['e2','2. 多维度转化率对比'],['e3','　时间趋势'],['e4','　相关不等于因果']],
html: function(){
  return '<div class="chap-h"><div class="eyebrow">第三章</div><h1>探索性数据分析</h1><p>建模之前，先用图表“看看”数据，找到规律和线索。</p></div>'+
  concept('<p>'+T('探索性数据分析')+'（EDA）就像医生看病前先做体检：先看整体情况，再分门别类地比较，找出可疑的地方。它的核心工具很简单：<b>分组 + 算转化率 + 画图对比</b>。</p>')+
  '<h2 id="e1">1. 整体认购转化率概况</h2>'+
  '<div class="two"><div><div class="hero-num">'+pct(E.rate)+'</div><p class="muted">'+num(E.n_yes)+' 人认购 ÷ '+num(E.n)+' 次联系</p><p>下面每个圆点代表 1 位客户：<b>每 100 位中，只有约 11 位认购</b>。</p><div class="key-row"><span><i style="background:var(--c1)"></i>认购</span><span><i style="background:var(--neutral)"></i>未认购</span></div></div><div>'+dotGrid(100, Math.round(E.rate*100), 'd10')+'</div></div>'+
  concept('<p>这种“一类特别多、一类特别少”的情况叫 '+T('类别不平衡')+'。它会带来一个大坑：一个什么都不会、永远猜“不认购”的模型，准确率也能达到 '+pct(1-E.rate)+'！第四章会专门讲怎么避开这个坑。</p>')+
  '<h2 id="e2">2. 多维度转化率对比</h2>'+
  '<p>接下来按报告大纲的三大维度，分别比较不同人群的认购率。<b>看图方法</b>：每根横条是一组客户的认购率，竖线是整体平均 '+pct(E.rate)+'。横条超过竖线 = 这组人比平均更爱认购。把鼠标放到（或用手指点）横条上可以看到人数。</p>'+
  '<div class="tabs" id="edaTabs"></div><div class="chips" id="edaChips"></div>'+
  '<div class="chart-title" id="edaTitle"></div><div class="chart" id="edaChart"></div>'+
  '<div class="box concept" style="border-left-color:var(--c3)"><span class="tag">这张图告诉我们</span><p id="edaInsight"></p></div>'+
  '<p class="small muted">浅色横条表示这一组样本少于 '+'1000 人（月份）或 100 人（其他），数字容易受偶然因素影响，看的时候要打个折扣。</p>'+
  '<h3 id="e3">时间趋势：经济环境的影响有多大？</h3>'+
  '<p>数据是按时间先后排列的（2008 年 5 月 → 2010 年 11 月），中间正好经历了全球金融危机。下面两张图共用同一条时间轴：上图是认购率，下图是 3 个月欧元利率（每个点是前后 1000 通电话的平均值）。</p>'+
  '<div class="chart-title">认购率（滚动平均）</div><div class="chart" id="trendRate"></div>'+
  '<div class="chart-title">3 个月欧元利率（滚动平均）</div><div class="chart" id="trendEur"></div>'+
  '<p>两张图几乎是<b>镜像</b>：2008 年底利率暴跌之后，认购率从 5% 左右一路升到 40%–50%。这是整个数据集里最强烈的信号。</p>'+
  '<h3 id="e4">提醒：相关 ≠ 因果</h3>'+
  warnb('<p>EDA 看到的是“<b>相关</b>”，不一定是“<b>因果</b>”。例如 65 岁以上客户认购率高达 '+pct(R('age','65岁+').rate)+'，但其中很多人恰好是在经济低迷、利率很低的时期被联系的，而且多用手机联系。到底是“年龄”的作用，还是“时期”和“渠道”的作用？光看分组图分不清楚。</p><p>这就是为什么我们还需要<b>模型</b>：它能同时考虑所有因素，帮我们分辨每个因素的“净影响”（第五章）。</p>')+
  code('看看 Python 代码怎么写', '# 按“联系方式”分组，算每组的认购率（y 的平均值）\ndf.groupby("contact")["y"].agg(["count", "mean"])\n#            count    mean\n# cellular   26144   0.147\n# telephone  15044   0.052')+
  quiz('e1','根据 EDA，下面哪类客户的认购率<b>最高</b>？',['用座机联系的客户','上次营销成功的客户','这次活动被打了 10 次以上的客户','5 月份被联系的客户'],1,'上次营销成功的客户认购率高达 '+pct(R('poutcome','成功').rate)+'；座机、10 次以上、5 月都明显低于平均。')+
  quiz('e2','“3 月份被联系的客户认购率是 50.5%”，但 3 月只有 546 通电话。正确的理解是？',['以后应该把所有电话都集中在 3 月打','3 月的样本少，而且可能是银行在 3 月挑了特定客户，不能简单下结论','3 月的数据是错的，应该删除','月份和认购完全无关'],1,'样本少的组数字波动大；而且月份效应可能来自“那个月银行联系的是哪些人”，这就是相关≠因果。');
},
mount: function(){
  var g = '客户属性', cur = null;
  var drawChart = function(id){
    var d = dim(id); cur = id;
    var thr = id==='month' ? 1000 : 100;
    $('#edaTitle').textContent = d.name + ' 与认购率';
    hbar($('#edaChart'), d.rows.map(function(r){ return {label:r.label, value:r.rate, faint: r.n < thr, tip:'<b>'+esc(d.name)+'：'+esc(r.label)+'</b><br>认购率 '+pct(r.rate)+'<br><span class="tl">'+num(r.n)+' 人'+(r.n<thr?' · 样本少':'')+'</span>'}; }), {avg:E.rate, color:GC[g], aria:d.name+'与认购率'});
    $('#edaInsight').innerHTML = INSIGHT[id] ? INSIGHT[id]() : '';
  };
  var drawTabs = function(){
    $('#edaTabs').innerHTML = Object.keys(E.dims).map(function(k){ return '<button class="tab'+(k===g?' on':'')+'" data-g="'+k+'"><span class="sw" style="background:'+GC[k]+'"></span>'+k+'</button>'; }).join('');
    $$('#edaTabs .tab').forEach(function(b){ b.onclick = function(){ g = b.getAttribute('data-g'); drawTabs(); }; });
    var list = E.dims[g];
    chips($('#edaChips'), list.map(function(d){ return {id:d.id, name:d.name}; }), list[0].id, drawChart);
    drawChart(list[0].id);
  };
  drawTabs();
  var tr = E.trend, x0 = tr[0].i, x1 = tr[tr.length-1].i;
  var hov = function(xv){ var best = tr[0]; tr.forEach(function(p){ if (Math.abs(p.i-xv) < Math.abs(best.i-xv)) best = p; }); return best; };
  var xT = [0,10000,20000,30000,40000].filter(function(v){ return v>=x0-1000; });
  xy($('#trendRate'), {height:190, x:[x0,x1], y:[0,0.6], yFmt:function(v){return pct(v,0);}, xTicks:[x0,10000,20000,30000,40000].slice(1), xFmt:function(v){ return '第'+(v/10000)+'万条'; },
    series:[{pts:tr.map(function(p){return [p.i,p.rate];}), color:'var(--c1)', area:true}],
    refs:[{y:E.rate, label:'整体平均 '+pct(E.rate), anchor:'start'}],
    hover:function(xv){ var p = hov(xv); return {x:p.i, pts:[{y:p.rate,color:'var(--c1)'}], html:'<span class="tl">第 '+num(p.i)+' 条记录附近</span><br>认购率 <b>'+pct(p.rate)+'</b><br>利率 '+p.eur.toFixed(2)+'%'}; }, aria:'认购率随时间变化'});
  xy($('#trendEur'), {height:190, x:[x0,x1], y:[0,6], yFmt:function(v){return v+'%';}, xTicks:[x0,10000,20000,30000,40000].slice(1), xFmt:function(v){ return '第'+(v/10000)+'万条'; }, xLabel:'2008年5月 → 2010年11月（按时间先后）',
    series:[{pts:tr.map(function(p){return [p.i,p.eur];}), color:'var(--c3)', area:true}],
    hover:function(xv){ var p = hov(xv); return {x:p.i, pts:[{y:p.eur,color:'var(--c3)'}], html:'<span class="tl">第 '+num(p.i)+' 条记录附近</span><br>利率 <b>'+p.eur.toFixed(2)+'%</b><br>认购率 '+pct(p.rate)}; }, aria:'利率随时间变化'});
}});

/* ---------- 四、模型设计 ---------- */
page({id:'model', num:'四', title:'模型设计', subs:[['m0','什么是模型'],['m1','1. 四个对比模型'],['m1a','　多数类基线'],['m1b','　逻辑回归'],['m1c','　剪枝决策树'],['m1d','　随机森林'],['m1e','　调参与交叉验证'],['m2','2. 评估指标'],['m2a','　阈值实验室'],['m2b','　ROC 与 AUC']],
html: function(){
  var base = M['多数类基线'], tl = D.toy_lr, tu = D.tuned;
  return '<div class="chap-h"><div class="eyebrow">第四章</div><h1>模型设计</h1><p>用 4 个由简到繁的模型给客户打分，并学会怎么给模型“打分数”。</p></div>'+
  '<h2 id="m0">什么是模型？</h2>'+
  analogy('<p>一位干了 20 年的老销售，看一眼客户资料就能说“这个人有戏”“那个人别浪费时间”。他的判断来自几千次打电话的经验。<br><b>机器学习模型</b>做的是同样的事：从 '+num(D.split.train)+' 条训练数据里总结经验，学出一套<b>打分规则</b>。</p>')+
  '<div class="pipe"><div class="pb">一位新客户的 19 个特征</div><span class="ar">→</span><div class="pb dark">模型（打分规则）</div><span class="ar">→</span><div class="pb">打分 0.82<br><span class="muted small">很可能认购</span></div><span class="ar">→</span><div class="pb">分数 ≥ '+T('阈值')+' 就打电话</div></div>'+
  '<h2 id="m1">1. 四个对比模型</h2>'+
  '<p>我们从最简单的开始，一步步增加复杂度。就像比赛要有“及格线”，第一个模型就是那条及格线。</p>'+
  '<h3 id="m1a">模型 ①　多数类基线：永远猜“不认购”</h3>'+
  '<p>'+T('基线模型')+'是一个完全不动脑子的模型：既然大多数人不认购，那就<b>对所有人都猜“不认购”</b>。</p>'+
  tryit('<p>猜猜看：这个“懒惰模型”在测试集上的准确率是多少？</p><div class="btns"><button class="btn pri" id="baseBtn">揭晓答案</button></div><div id="baseOut"></div>')+
  '<h3 id="m1b">模型 ②　逻辑回归：加权打分 + S 形曲线</h3>'+
  '<p>'+T('逻辑回归')+'的思路很像“打分卡”：每个特征都有一个权重，比如“上次营销成功 +0.2 分”“用座机联系 −0.3 分”，把所有分数加起来，再通过一条 <b>S 形曲线</b>压成 0~1 之间的概率。</p>'+
  tryit('<p>先看一个只用 <b>1 个特征（利率）</b>的简化版逻辑回归。拖动滑块改变利率，看看预测的认购概率怎么变。圆点是真实数据里各利率区间的实际认购率。</p>'+
    '<div class="slider-row"><span class="small">利率</span><input type="range" id="lrX" min="0.6" max="5.1" step="0.05" value="4.86"><output id="lrXo"></output></div>'+
    '<div class="chart" id="lrChart"></div><div id="lrTxt" class="small"></div>')+
  concept('<p>真实模型用的是全部 '+D.split.n_features_encoded+' 列特征：分数 = 截距 + 权重₁×特征₁ + 权重₂×特征₂ + … ，然后同样套进 S 形曲线。<b>优点</b>：简单、快、每个权重都能解释。<b>缺点</b>：只能表达“越大越好/越小越好”这种直线关系，复杂的组合规律学不到。</p>')+
  '<h3 id="m1c">模型 ③　剪枝决策树：一连串的是非题</h3>'+
  '<p>'+T('决策树')+'像玩“20 个问题”游戏：每一步问一个是/否问题，把客户分成两组，再接着问，直到每组的人足够“纯”。下面是我们训练出的真实决策树的<b>前三层</b>（完整的树有 '+D.tree_depth+' 层、'+D.tree_leaves+' 个叶子）。</p>'+
  tryit('<p>拿一位客户走一遍：根据问题选择答案，看看他最后落到哪一组、那组人的真实认购率是多少。</p><div class="walker" id="walker"></div>')+
  '<div class="tree-wrap"><div id="treeSvg"></div></div>'+
  '<p class="small muted">每个方框里的“认购率”是训练集中落到这一组的客户的真实认购率。</p>'+
  '<p>树的<b>第一个问题</b>就是“就业人数是否 ≤ 5087.65 千人”——也就是“当时经济是不是很差”。经济差的时期认购率 '+pct(D.tree.left.rate)+'，经济好的时期只有 '+pct(D.tree.right.rate)+'。模型自己“发现”了宏观经济是最重要的分界线。</p>'+
  '<h4>为什么要“剪枝”？</h4>'+
  '<p>如果不加限制，决策树会一直分下去，直到每个叶子里只有一两个人——相当于把训练数据<b>死记硬背</b>下来了，这叫 '+T('过拟合')+'。'+T('剪枝')+'就是给树设限制，比如“每个叶子至少要有 200 个人”。</p>'+
  tryit('<p>下图横轴是树的深度（问了几层问题），两条线分别是在<b>训练数据</b>上和在<b>没见过的验证数据</b>上的成绩（AUC）。切换“不剪枝 / 剪枝”比较一下：</p><div class="seg" id="dcSeg"></div><div class="chart" id="dcChart"></div><p class="small" id="dcTxt"></p>')+
  '<h3 id="m1d">模型 ④　随机森林：几百棵树一起投票</h3>'+
  '<p>一棵树容易“想太多”或“钻牛角尖”。'+T('随机森林')+'的办法是：训练 <b>300 棵</b>各不相同的树（每棵树只看一部分数据、一部分特征），最后让它们<b>投票取平均</b>。这就像请 300 位专家各自打分，再取平均——个别专家的偏见会被抵消。</p>'+
  tryit('<p>选一位测试集里的真实客户，看看 300 棵树分别给他打了多少分：</p><div class="seg" id="rfSeg"></div><p class="small" id="rfDesc"></p><div class="chart" id="rfChart"></div><p class="small" id="rfTxt"></p>')+
  '<h3 id="m1e">调参与交叉验证</h3>'+
  '<p>每个模型都有一些需要人来定的“旋钮”（参数），比如决策树的“每个叶子至少几个人”。怎么选？我们用 <b>5 折'+T('交叉验证','交叉验证')+'</b>：</p>'+
  '<div id="cvViz"></div>'+
  '<p>把训练集分成 5 份，轮流拿 4 份训练、1 份验证，5 次成绩取平均。哪组参数平均成绩最好就选哪组。<b>全程不碰测试集</b>。</p>'+
  concept('<p><b>'+T('类别权重')+'：</b>因为认购的人太少，训练时我们让模型“更重视”认购客户：每个认购样本的权重约是未认购样本的 '+((1-E.rate)/E.rate).toFixed(1)+' 倍（<span class="kbd">class_weight="balanced"</span>）。否则模型很容易偷懒，学成“永远猜不认购”。副作用是模型的打分整体偏高，只能看高低排序，不能直接当作真实概率。</p>')+
  '<div class="tbl-wrap"><table><thead><tr><th>模型</th><th>调了哪些参数</th><th>选中的参数</th><th class="num">交叉验证 AUC</th></tr></thead><tbody>'+
    '<tr><td>逻辑回归</td><td>正则化强度 C</td><td>C = '+tu['逻辑回归'].best_params.C+'</td><td class="num">'+f3(tu['逻辑回归'].cv_auc)+'</td></tr>'+
    '<tr><td>剪枝决策树</td><td>最大深度、叶子最少样本数</td><td>叶子 ≥ '+tu['剪枝决策树'].best_params.min_samples_leaf+' 人，深度 ≤ '+tu['剪枝决策树'].best_params.max_depth+'</td><td class="num">'+f3(tu['剪枝决策树'].cv_auc)+'</td></tr>'+
    '<tr><td>随机森林</td><td>叶子最少样本数、每次分叉可选特征数</td><td>300 棵树，叶子 ≥ '+tu['随机森林'].best_params.min_samples_leaf+' 人，特征数 = √总数</td><td class="num">'+f3(tu['随机森林'].cv_auc)+'</td></tr>'+
  '</tbody></table></div>'+

mount: function(){

  var roi = function(){

    $('#gainTxt').innerHTML = '只打前 <b>'+k+'%</b> 的客户，就能找到 <b>'+pct(c)+'</b> 的认购者；随机打同样多的电话只能找到 '+k+'%。提升度 = <b>'+(c/(k/100)).toFixed(2)+' 倍</b>。';

  };

  '<h2 id="f2">术语表</h2><p class="small muted">按学习顺序排列。</p><dl class="gloss">'+keys.map(function(k){ return '<dt>'+k+'</dt><dd>'+GLOSS[k]+'</dd>'; }).join('')+'</dl>'+

  '<div class="tbl-wrap"><table><thead><tr><th>文件</th><th>作用</th></tr></thead><tbody>'+
  '<tr><td>data/bank-additional-full.csv</td><td>原始数据（41,188 行 × 21 列，分号分隔）</td></tr>'+
  '<tr><td>analysis.py</td><td>完整分析代码：预处理、EDA、4 个模型、评估、重要性与方向分析</td></tr>'+
  '<tr><td>results/results.json</td><td>分析输出的全部数字，网页和报告都用它</td></tr>'+
  '<tr><td>page/template.html + build_page.py</td><td>网页模板和生成脚本</td></tr>'+
  '<tr><td>报告草稿.md</td><td>按大纲写好的报告初稿（含真实数字）</td></tr>'+
  '</tbody></table></div>'+
  '<p class="small muted">分析运行环境：Python 3 + pandas + scikit-learn，随机种子 42，结果可复现。</p>';
}});

var QUIZ_TOTAL = 0;
(function(){ var tmp = document.createElement('div'); PAGES.forEach(function(p){ tmp.innerHTML = p.html(); QUIZ_TOTAL += tmp.querySelectorAll('[data-quiz]').length; }); })();

/* ================= router & nav ================= */
var curPage = null;
function updateProgress(){
  var visited = store.get('visited', {}), q = store.get('quiz', {});
  var v = PAGES.filter(function(p){ return visited[p.id]; }).length, qn = Object.keys(q).length;
  var frac = (v/PAGES.length)*0.6 + (QUIZ_TOTAL ? (qn/QUIZ_TOTAL)*0.4 : 0);
  $('#progBar').style.width = Math.round(frac*100)+'%';
  $('#progTxt').textContent = '学习进度 '+Math.round(frac*100)+'% · 小测验 '+qn+'/'+QUIZ_TOTAL;
  $('#topProg').textContent = Math.round(frac*100)+'%';
  $$('#toc > li').forEach(function(li){ var id = li.getAttribute('data-id'), ck = $('.ck', li); if (ck) ck.textContent = visited[id] ? '✓' : ''; });
}
function buildToc(){
  $('#toc').innerHTML = PAGES.map(function(p){
    return '<li data-id="'+p.id+'"><a href="#'+p.id+'"><span class="n">'+(p.num||'·')+'</span><span>'+p.title+'</span><span class="ck"></span></a>'+
      '<ul'+(p.id===curPage?'':' style="display:none"')+'>'+(p.subs||[]).map(function(s){ return '<li><a href="#'+p.id+'/'+s[0]+'">'+s[1]+'</a></li>'; }).join('')+'</ul></li>';
  }).join('');
}
function closeMenu(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('open'); }
$('#menuBtn').onclick = function(){ $('#side').classList.add('open'); $('#scrim').classList.add('open'); };
$('#scrim').onclick = closeMenu;
function route(){
  var h = (location.hash || '#home').slice(1).split('/'), pid = h[0], sub = h[1];
  var idx = 0; PAGES.forEach(function(p, i){ if (p.id===pid) idx = i; });
  var p = PAGES[idx];
  if (curPage !== p.id) {
    curPage = p.id; REG = []; hideTip();
    $('#page').innerHTML = p.html();
    if (p.mount) p.mount();
    bindQuiz($('#page'));
    var prev = PAGES[idx-1], next = PAGES[idx+1];
    $('#pager').innerHTML = (prev ? '<a href="#'+prev.id+'"><small>← 上一章</small>'+(prev.num?prev.num+'、':'')+prev.title+'</a>' : '<span></span>') + (next ? '<a class="next" href="#'+next.id+'"><small>下一章 →</small>'+(next.num?next.num+'、':'')+next.title+'</a>' : '<span></span>');
    $('#topTitle').textContent = (p.num?p.num+'、':'')+p.title;
    var v = store.get('visited', {}); v[p.id] = 1; store.set('visited', v);
    buildToc();
    $$('#toc > li').forEach(function(li){ li.classList.toggle('on', li.getAttribute('data-id')===p.id); });
    updateProgress();
    if (!sub) window.scrollTo(0, 0);
  }
  if (sub) { var t = document.getElementById(sub); if (t) setTimeout(function(){ var y = t.getBoundingClientRect().top + window.pageYOffset - (window.innerWidth<=900?60:16); window.scrollTo(0, y); }, 30); }
  closeMenu();
}
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
